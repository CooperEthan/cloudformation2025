AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudWatch Log Group monitoring for root user sign-in events and MFA removal events with SNS notifications.
  Monitors CloudTrail logs stored in CloudWatch Log Groups across the organization.

Parameters:
  CloudWatchLogGroupName:
    Type: String
    Description: Name of the CloudWatch Log Group containing CloudTrail logs (must already exist)
    Default: CloudTrail/OrganizationTrail
    ConstraintDescription: Must be an existing CloudWatch Log Group name

  NotificationEmail:
    Type: String
    Description: Email address to receive notifications.

  NotificationPhone:
    Type: String
    Description: Phone number (in E.164 format, e.g., +1234567890) to receive SMS notifications. Leave blank to skip SMS.
    Default: ""
    AllowedPattern: "^$|^\\+[1-9]\\d{1,14}$"
    ConstraintDescription: Must be in E.164 format (+1234567890) or empty to skip SMS notifications

  SlackWebhookURL:
    Type: String
    Description: Slack webhook URL for notifications (leave blank if not using Slack)
    Default: ""
    NoEcho: true

Resources:
  # KMS Key for SNS Topic Encryption
  SNSEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "KMS key for encrypting root security notifications SNS topic"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow CloudWatch to use the key
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - "kms:Decrypt"
              - "kms:GenerateDataKey"
              - "kms:CreateGrant"
              - "kms:DescribeKey"
            Resource: "*"
          - Sid: Allow SNS service to use the key
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - "kms:Decrypt"
              - "kms:GenerateDataKey"
              - "kms:CreateGrant"
              - "kms:DescribeKey"
            Resource: "*"

  # KMS Key Alias
  SNSEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/iv-edd-${AWS::AccountId}-sns-encryption-${AWS::Region}"
      TargetKeyId: !Ref SNSEncryptionKey

  # SNS Topic for Root Sign-in and MFA Notifications
  RootSecuritySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub iv-edd-${AWS::AccountId}-root-security-notifications-${AWS::Region}
      KmsMasterKeyId: !Ref SNSEncryptionKey

  # SNS Subscriptions
  RootSecuritySNSSubscriptionEmail:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref RootSecuritySNSTopic

  RootSecuritySNSSubscriptionSMS:
    Type: AWS::SNS::Subscription
    Condition: HasPhoneNumber
    Properties:
      Protocol: sms
      Endpoint: !Ref NotificationPhone
      TopicArn: !Ref RootSecuritySNSTopic

  # ==============================
  # Slack Notification Processor
  # ==============================
  SlackNotificationLambda:
    Type: AWS::Lambda::Function
    Condition: HasSlackWebhook
    Properties:
      FunctionName: !Sub iv-edd-${AWS::AccountId}-RootSecuritySlackNotifier-${AWS::Region}
      Description: Formats root security alerts for Slack
      Runtime: python3.12
      Handler: index.lambda_handler
      MemorySize: 128
      Timeout: 10
      ReservedConcurrentExecutions: 5
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SlackWebhookURL: !Ref SlackWebhookURL
          CloudWatchLogGroupName: !Ref CloudWatchLogGroupName
      Code:
        ZipFile: |
          import json
          import urllib3
          import os
          import boto3
          from datetime import datetime, timedelta
          import re

          def lambda_handler(event, context):
              try:
                  http = urllib3.PoolManager()
                  slack_webhook_url = os.environ.get('SlackWebhookURL')
                  log_group_name = os.environ.get('CloudWatchLogGroupName')
                  
                  if not slack_webhook_url:
                      print("No Slack webhook URL configured")
                      return {"statusCode": 200, "body": "No Slack webhook configured"}
                  
                  # Parse SNS message
                  sns_record = event['Records'][0]['Sns']
                  message_str = sns_record['Message']
                  
                  print(f"Received SNS message: {message_str}")
                  
                  # Try to parse as CloudWatch alarm JSON
                  try:
                      sns_message = json.loads(message_str)
                      
                      # Check if this is a CloudWatch alarm
                      if 'AlarmName' in sns_message and 'NewStateReason' in sns_message:
                          # CloudWatch alarm message
                          alarm_name = sns_message.get('AlarmName', 'Unknown Alarm')
                          reason = sns_message.get('NewStateReason', 'Security event detected')
                          timestamp = sns_message.get('StateChangeTime', 'Unknown')
                          region = sns_message.get('Region', 'us-east-1')
                          
                          # Initialize defaults
                          source_ip = "Unknown"
                          user_agent = "Unknown"
                          event_type = "Unknown"
                          console_login_status = "Unknown"
                          user_identity_type = "Unknown"
                          account_id = "Unknown"
                          mfa_used = "Unknown"
                          event_time = "Unknown"
                          
                          # Extract account ID from alarm name
                          if '-' in alarm_name:
                              parts = alarm_name.split('-')
                              for part in parts:
                                  if part.isdigit() and len(part) == 12:
                                      account_id = part
                                      break
                          
                          # Query CloudWatch Logs for recent ConsoleLogin events
                          if log_group_name and 'RootUserSignIn' in alarm_name:
                              try:
                                  print(f"Querying CloudWatch Logs: {log_group_name}")
                                  logs_client = boto3.client('logs')
                                  
                                  # Search for ConsoleLogin events in the last 10 minutes
                                  end_time = datetime.now()
                                  start_time = end_time - timedelta(minutes=10)
                                  
                                  response = logs_client.filter_log_events(
                                      logGroupName=log_group_name,
                                      startTime=int(start_time.timestamp() * 1000),
                                      endTime=int(end_time.timestamp() * 1000),
                                      filterPattern='{ $.eventName = "ConsoleLogin" && $.userIdentity.type = "Root" }'
                                  )
                                  
                                  # Get the most recent event
                                  if response['events']:
                                      latest_event = response['events'][-1]  # Most recent
                                      cloudtrail_event = json.loads(latest_event['message'])
                                      
                                      print("Found CloudTrail event in logs!")
                                      
                                      # Extract security details
                                      source_ip = cloudtrail_event.get('sourceIPAddress', 'Unknown')
                                      user_agent = cloudtrail_event.get('userAgent', 'Unknown')
                                      event_type = cloudtrail_event.get('eventType', 'Unknown')
                                      event_time = cloudtrail_event.get('eventTime', 'Unknown')
                                      
                                      # Handle nested responseElements
                                      response_elements = cloudtrail_event.get('responseElements', {})
                                      if isinstance(response_elements, dict):
                                          console_login_status = response_elements.get('ConsoleLogin', 'Unknown')
                                      
                                      # Handle nested userIdentity
                                      user_identity = cloudtrail_event.get('userIdentity', {})
                                      if isinstance(user_identity, dict):
                                          user_identity_type = user_identity.get('type', 'Unknown')
                                          if account_id == "Unknown":
                                              account_id = user_identity.get('accountId', 'Unknown')
                                      
                                      # Handle nested additionalEventData
                                      additional_data = cloudtrail_event.get('additionalEventData', {})
                                      if isinstance(additional_data, dict):
                                          mfa_used = additional_data.get('MFAUsed', 'Unknown')
                                  
                                  else:
                                      print("No recent ConsoleLogin events found in logs")
                              
                              except Exception as e:
                                  print(f"Error querying CloudWatch Logs: {e}")
                          
                          # Determine alert type and color based on alarm name
                          if 'RootUserSignIn' in alarm_name:
                              alert_type = "ROOT USER SIGN-IN"
                              color = "#ff6600"  # Orange
                              emoji = ":warning:"
                              urgency = "HIGH"
                          elif 'RootMFARemoval' in alarm_name:
                              alert_type = "ROOT MFA REMOVAL"
                              color = "#ff0000"  # Red
                              emoji = ":rotating_light:"
                              urgency = "CRITICAL"
                          else:
                              alert_type = "SECURITY ALERT"
                              color = "#ff0000"
                              emoji = ":warning:"
                              urgency = "HIGH"
                          
                          # Truncate user agent if too long
                          if len(user_agent) > 80:
                              user_agent = user_agent[:77] + "..."
                          
                          # Enhanced message with security details
                          slack_message = {
                              "text": f"{emoji} *AWS {alert_type} DETECTED* {emoji}",
                              "attachments": [{
                                  "color": color,
                                  "fields": [
                                      {"title": "🚨 Alert Type", "value": alert_type, "short": True},
                                      {"title": "⚠️ Urgency", "value": urgency, "short": True},
                                      {"title": "🏢 Account ID", "value": account_id, "short": True},
                                      {"title": "🌍 Region", "value": region, "short": True},
                                      {"title": "👤 User Identity", "value": user_identity_type, "short": True},
                                      {"title": "✅ Login Status", "value": console_login_status, "short": True},
                                      {"title": "🌐 Source IP", "value": source_ip, "short": True},
                                      {"title": "🔐 MFA Used", "value": mfa_used, "short": True},
                                      {"title": "📱 Event Type", "value": event_type, "short": True},
                                      {"title": "⏰ Event Time", "value": event_time, "short": True},
                                      {"title": "🖥️ User Agent", "value": user_agent, "short": False},
                                      {"title": "🔍 Next Steps", "value": "• Verify this was authorized access\n• Review account activity immediately\n• Check for any unauthorized changes\n• Ensure MFA remains enabled", "short": False}
                                  ],
                                  "footer": "AWS Security Alert System | Investigate immediately",
                                  "ts": int(datetime.now().timestamp())
                              }]
                          }
                      
                      else:
                          # This might be a direct event or test message
                          slack_message = {
                              "text": ":information_source: *AWS Event Detected*",
                              "attachments": [{
                                  "color": "#36a64f",
                                  "fields": [
                                      {"title": "Event", "value": str(sns_message)[:500], "short": False}
                                  ],
                                  "footer": "AWS Event System",
                                  "ts": int(datetime.now().timestamp())
                              }]
                          }
                  
                  except json.JSONDecodeError:
                      # This is a plain text message (like test messages)
                      slack_message = {
                          "text": ":information_source: *AWS Notification Test*",
                          "attachments": [{
                              "color": "#36a64f",
                              "fields": [
                                  {"title": "Subject", "value": sns_record.get('Subject', 'Test Message'), "short": True},
                                  {"title": "Message", "value": message_str[:500], "short": False}
                              ],
                              "footer": "AWS SNS Test",
                              "ts": int(datetime.now().timestamp())
                          }]
                      }
                  
                  print(f"Sending Slack message: {json.dumps(slack_message)}")
                  
                  response = http.request(
                      'POST',
                      slack_webhook_url,
                      body=json.dumps(slack_message),
                      headers={'Content-Type': 'application/json'}
                  )
                  
                  print(f"Slack response status: {response.status}")
                  return {"statusCode": response.status}
                  
              except Exception as e:
                  print(f"Error processing alert: {str(e)}")
                  return {
                      "statusCode": 500,
                      "body": f"Error processing alert: {str(e)}"
                  }

  # Lambda IAM Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasSlackWebhook
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchLogsReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:FilterLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: 
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${CloudWatchLogGroupName}:*"

  # Lambda Subscription Permission
  LambdaSubscriptionPermission:
    Type: AWS::Lambda::Permission
    Condition: HasSlackWebhook
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SlackNotificationLambda
      Principal: sns.amazonaws.com
      SourceArn: !Ref RootSecuritySNSTopic

  RootSecuritySNSSubscriptionLambda:
    Type: AWS::SNS::Subscription
    Condition: HasSlackWebhook
    DependsOn: LambdaSubscriptionPermission
    Properties:
      Protocol: lambda
      Endpoint: !GetAtt SlackNotificationLambda.Arn
      TopicArn: !Ref RootSecuritySNSTopic

  # ==============================
  # CloudWatch Log Metric Filters
  # ==============================
  
  # Root User Sign-In Metric Filter
  RootUserSignInMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroupName
      FilterName: !Sub iv-edd-${AWS::AccountId}-RootUserSignInFilter-${AWS::Region}
      FilterPattern: '{ $.eventName = "ConsoleLogin" && $.userIdentity.type = "Root" }'
      MetricTransformations:
        - MetricNamespace: "Security/RootAccess"
          MetricName: "RootUserSignInEvents"
          MetricValue: "1"
          DefaultValue: 0

  # Root User MFA Removal Metric Filter
  RootUserMFARemovalMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroupName
      FilterName: !Sub iv-edd-${AWS::AccountId}-RootMFARemovalFilter-${AWS::Region}
      FilterPattern: '{ ($.eventName = "DeactivateMFADevice" || $.eventName = "DeleteVirtualMFADevice") && $.userIdentity.type = "Root" }'
      MetricTransformations:
        - MetricNamespace: "Security/RootAccess"
          MetricName: "RootMFARemovalEvents"
          MetricValue: "1"
          DefaultValue: 0

  # ==============================
  # CloudWatch Alarms
  # ==============================
  
  # Root User Sign-In Alarm
  RootUserSignInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alarm when root user signs into AWS Console"
      MetricName: "RootUserSignInEvents"
      Namespace: "Security/RootAccess"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref RootSecuritySNSTopic
      OKActions:
        - !Ref RootSecuritySNSTopic
      TreatMissingData: notBreaching
      DatapointsToAlarm: 1

  # Root User MFA Removal Alarm
  RootUserMFARemovalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "CRITICAL: Root user MFA device has been removed or deactivated"
      MetricName: "RootMFARemovalEvents"
      Namespace: "Security/RootAccess"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref RootSecuritySNSTopic
      OKActions:
        - !Ref RootSecuritySNSTopic
      TreatMissingData: notBreaching
      DatapointsToAlarm: 1

  # SNS Topic Policy
  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref RootSecuritySNSTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: "sns:Publish"
            Resource: !Ref RootSecuritySNSTopic

Conditions:
  HasSlackWebhook: !Not [!Equals [!Ref SlackWebhookURL, ""]]
  HasPhoneNumber: !Not [!Equals [!Ref NotificationPhone, ""]]

Outputs:
  SNSTopicArn:
    Description: SNS topic ARN for root security notifications
    Value: !Ref RootSecuritySNSTopic
    
  CloudWatchLogGroup:
    Description: CloudWatch Log Group being monitored
    Value: !Ref CloudWatchLogGroupName
    
  SlackNotificationLambdaArn:
    Description: ARN of the Slack notification Lambda function (if deployed)
    Value: !If [HasSlackWebhook, !GetAtt SlackNotificationLambda.Arn, "No Slack webhook provided"]
    
  RootSignInAlarmArn:
    Description: ARN of the CloudWatch alarm for root sign-ins
    Value: !GetAtt RootUserSignInAlarm.Arn

  RootMFARemovalAlarmArn:
    Description: ARN of the CloudWatch alarm for root MFA removal
    Value: !GetAtt RootUserMFARemovalAlarm.Arn
    
  SignInMetricFilterName:
    Description: Name of the metric filter monitoring root sign-ins
    Value: !Ref RootUserSignInMetricFilter

  MFARemovalMetricFilterName:
    Description: Name of the metric filter monitoring root MFA removal
    Value: !Ref RootUserMFARemovalMetricFilter