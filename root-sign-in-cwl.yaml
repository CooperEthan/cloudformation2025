AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudWatch Log Group monitoring for root user sign-in events and MFA removal events with SNS notifications.
  Monitors CloudTrail logs stored in CloudWatch Log Groups across the organization.

Parameters:
  CloudWatchLogGroupName:
    Type: String
    Description: Name of the CloudWatch Log Group containing CloudTrail logs (must already exist)
    Default: CloudTrail/OrganizationTrail
    ConstraintDescription: Must be an existing CloudWatch Log Group name

  NotificationEmail:
    Type: String
    Description: Email address to receive notifications.

  NotificationPhone:
    Type: String
    Description: Phone number (in E.164 format, e.g., +1234567890) to receive SMS notifications. Leave blank to skip SMS.
    Default: ""
    AllowedPattern: "^$|^\\+[1-9]\\d{1,14}$"
    ConstraintDescription: Must be in E.164 format (+1234567890) or empty to skip SMS notifications

  SlackWebhookURL:
    Type: String
    Description: Slack webhook URL for notifications (leave blank if not using Slack)
    Default: ""
    NoEcho: true

Resources:
  # SNS Topic for Root Sign-in and MFA Notifications
  RootSecuritySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub iv-edd-${AWS::AccountId}-root-security-notifications-${AWS::Region}

  # SNS Subscriptions
  RootSecuritySNSSubscriptionEmail:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref RootSecuritySNSTopic

  RootSecuritySNSSubscriptionSMS:
    Type: AWS::SNS::Subscription
    Condition: HasPhoneNumber
    Properties:
      Protocol: sms
      Endpoint: !Ref NotificationPhone
      TopicArn: !Ref RootSecuritySNSTopic

  # ==============================
  # Slack Notification Processor
  # ==============================
  SlackNotificationLambda:
    Type: AWS::Lambda::Function
    Condition: HasSlackWebhook
    Properties:
      FunctionName: !Sub iv-edd-${AWS::AccountId}-RootSecuritySlackNotifier-${AWS::Region}
      Description: Formats root security alerts for Slack
      Runtime: python3.12
      Handler: index.lambda_handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SlackWebhookURL: !Ref SlackWebhookURL
      Code:
        ZipFile: |
          import json
          import urllib3
          import os
          from datetime import datetime

          def lambda_handler(event, context):
              try:
                  http = urllib3.PoolManager()
                  slack_webhook_url = os.environ.get('SlackWebhookURL')
                  
                  if not slack_webhook_url:
                      print("No Slack webhook URL configured")
                      return {"statusCode": 200, "body": "No Slack webhook configured"}
                  
                  # Parse SNS message
                  sns_record = event['Records'][0]['Sns']
                  message_str = sns_record['Message']
                  
                  print(f"Received SNS message: {message_str}")
                  
                  # Try to parse as CloudWatch alarm JSON, fall back to plain text
                  try:
                      sns_message = json.loads(message_str)
                      # This is a CloudWatch alarm
                      alarm_name = sns_message.get('AlarmName', 'Unknown Alarm')
                      reason = sns_message.get('NewStateReason', 'Security event detected')
                      timestamp = sns_message.get('StateChangeTime', 'Unknown')
                      
                      # Determine alert type and color based on alarm name
                      if 'RootUserSignIn' in alarm_name:
                          alert_type = "ROOT USER SIGN-IN"
                          color = "#ff6600"  # Orange
                          emoji = ":warning:"
                      elif 'RootMFARemoval' in alarm_name:
                          alert_type = "ROOT MFA REMOVAL"
                          color = "#ff0000"  # Red
                          emoji = ":rotating_light:"
                      else:
                          alert_type = "SECURITY ALERT"
                          color = "#ff0000"
                          emoji = ":warning:"
                      
                      slack_message = {
                          "text": f"{emoji} *AWS {alert_type} DETECTED* {emoji}",
                          "attachments": [{
                              "color": color,
                              "fields": [
                                  {"title": "Alert Type", "value": alert_type, "short": True},
                                  {"title": "Time", "value": timestamp, "short": True},
                                  {"title": "Alarm", "value": alarm_name, "short": False},
                                  {"title": "Details", "value": reason, "short": False}
                              ],
                              "footer": "AWS Security Alert System",
                              "ts": int(datetime.now().timestamp())
                          }]
                      }
                  
                  except json.JSONDecodeError:
                      # This is a plain text message (like test messages)
                      slack_message = {
                          "text": ":information_source: *AWS Notification Test*",
                          "attachments": [{
                              "color": "#36a64f",
                              "fields": [
                                  {"title": "Subject", "value": sns_record.get('Subject', 'Test Message'), "short": True},
                                  {"title": "Message", "value": message_str, "short": False}
                              ],
                              "footer": "AWS SNS Test",
                              "ts": int(datetime.now().timestamp())
                          }]
                      }
                  
                  print(f"Sending Slack message: {json.dumps(slack_message)}")
                  
                  response = http.request(
                      'POST',
                      slack_webhook_url,
                      body=json.dumps(slack_message),
                      headers={'Content-Type': 'application/json'}
                  )
                  
                  print(f"Slack response status: {response.status}")
                  return {"statusCode": response.status}
                  
              except Exception as e:
                  print(f"Error processing alert: {str(e)}")
                  return {
                      "statusCode": 500,
                      "body": f"Error processing alert: {str(e)}"
                  }

  # Lambda IAM Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasSlackWebhook
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda Subscription Permission
  LambdaSubscriptionPermission:
    Type: AWS::Lambda::Permission
    Condition: HasSlackWebhook
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SlackNotificationLambda
      Principal: sns.amazonaws.com
      SourceArn: !Ref RootSecuritySNSTopic

  RootSecuritySNSSubscriptionLambda:
    Type: AWS::SNS::Subscription
    Condition: HasSlackWebhook
    DependsOn: LambdaSubscriptionPermission
    Properties:
      Protocol: lambda
      Endpoint: !GetAtt SlackNotificationLambda.Arn
      TopicArn: !Ref RootSecuritySNSTopic

  # ==============================
  # CloudWatch Log Metric Filters
  # ==============================
  
  # Root User Sign-In Metric Filter
  RootUserSignInMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroupName
      FilterName: !Sub iv-edd-${AWS::AccountId}-RootUserSignInFilter-${AWS::Region}
      FilterPattern: '{ $.eventName = "ConsoleLogin" && $.userIdentity.type = "Root" }'
      MetricTransformations:
        - MetricNamespace: "Security/RootAccess"
          MetricName: "RootUserSignInEvents"
          MetricValue: "1"
          DefaultValue: 0

  # Root User MFA Removal Metric Filter
  RootUserMFARemovalMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroupName
      FilterName: !Sub iv-edd-${AWS::AccountId}-RootMFARemovalFilter-${AWS::Region}
      FilterPattern: '{ ($.eventName = "DeactivateMFADevice" || $.eventName = "DeleteVirtualMFADevice") && $.userIdentity.type = "Root" }'
      MetricTransformations:
        - MetricNamespace: "Security/RootAccess"
          MetricName: "RootMFARemovalEvents"
          MetricValue: "1"
          DefaultValue: 0

  # ==============================
  # CloudWatch Alarms
  # ==============================
  
  # Root User Sign-In Alarm
  RootUserSignInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub iv-edd-${AWS::AccountId}-RootUserSignIn-${AWS::Region}
      AlarmDescription: "Alarm when root user signs into AWS Console"
      MetricName: "RootUserSignInEvents"
      Namespace: "Security/RootAccess"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref RootSecuritySNSTopic
      OKActions:
        - !Ref RootSecuritySNSTopic
      TreatMissingData: notBreaching
      DatapointsToAlarm: 1

  # Root User MFA Removal Alarm
  RootUserMFARemovalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub iv-edd-${AWS::AccountId}-RootMFARemoval-${AWS::Region}
      AlarmDescription: "CRITICAL: Root user MFA device has been removed or deactivated"
      MetricName: "RootMFARemovalEvents"
      Namespace: "Security/RootAccess"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref RootSecuritySNSTopic
      OKActions:
        - !Ref RootSecuritySNSTopic
      TreatMissingData: notBreaching
      DatapointsToAlarm: 1

  # SNS Topic Policy
  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref RootSecuritySNSTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: "sns:Publish"
            Resource: !Ref RootSecuritySNSTopic

Conditions:
  HasSlackWebhook: !Not [!Equals [!Ref SlackWebhookURL, ""]]
  HasPhoneNumber: !Not [!Equals [!Ref NotificationPhone, ""]]

Outputs:
  SNSTopicArn:
    Description: SNS topic ARN for root security notifications
    Value: !Ref RootSecuritySNSTopic
    
  CloudWatchLogGroup:
    Description: CloudWatch Log Group being monitored
    Value: !Ref CloudWatchLogGroupName
    
  SlackNotificationLambdaArn:
    Description: ARN of the Slack notification Lambda function (if deployed)
    Value: !If [HasSlackWebhook, !GetAtt SlackNotificationLambda.Arn, "No Slack webhook provided"]
    
  RootSignInAlarmArn:
    Description: ARN of the CloudWatch alarm for root sign-ins
    Value: !GetAtt RootUserSignInAlarm.Arn

  RootMFARemovalAlarmArn:
    Description: ARN of the CloudWatch alarm for root MFA removal
    Value: !GetAtt RootUserMFARemovalAlarm.Arn
    
  SignInMetricFilterName:
    Description: Name of the metric filter monitoring root sign-ins
    Value: !Ref RootUserSignInMetricFilter

  MFARemovalMetricFilterName:
    Description: Name of the metric filter monitoring root MFA removal
    Value: !Ref RootUserMFARemovalMetricFilter