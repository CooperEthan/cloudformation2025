AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudWatch Log Group monitoring for root user sign-in events with SNS notifications.
  Monitors CloudTrail logs stored in CloudWatch Log Groups across the organization.

Parameters:
  CloudWatchLogGroupName:
    Type: String
    Description: Name of the CloudWatch Log Group containing CloudTrail logs (must already exist)
    Default: CloudTrail/OrganizationTrail
    ConstraintDescription: Must be an existing CloudWatch Log Group name

  NotificationEmail:
    Type: String
    Description: Email address to receive notifications.

  NotificationPhone:
    Type: String
    Description: Phone number (in E.164 format, e.g., +1234567890) to receive SMS notifications. Leave blank to skip SMS.
    Default: ""
    AllowedPattern: "^$|^\\+[1-9]\\d{1,14}$"
    ConstraintDescription: Must be in E.164 format (+1234567890) or empty to skip SMS notifications

  SlackWebhookURL:
    Type: String
    Description: Slack webhook URL for notifications (leave blank if not using Slack)
    Default: ""
    NoEcho: true

Resources:
  # SNS Topic for Root Sign-in Notifications
  RootSignInSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub iv-edd-${AWS::AccountId}-root-signin-notifications-${AWS::Region}
      KmsMasterKeyId: alias/aws/sns

  # SNS Subscriptions
  RootSignInSNSSubscriptionEmail:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref RootSignInSNSTopic

  RootSignInSNSSubscriptionSMS:
    Type: AWS::SNS::Subscription
    Condition: HasPhoneNumber
    Properties:
      Protocol: sms
      Endpoint: !Ref NotificationPhone
      TopicArn: !Ref RootSignInSNSTopic

  # ==============================
  # Slack Notification Processor
  # ==============================
  SlackNotificationLambda:
    Type: AWS::Lambda::Function
    Condition: HasSlackWebhook
    Properties:
      FunctionName: !Sub iv-edd-${AWS::AccountId}-RootSignInSlackNotifier-${AWS::Region}
      Description: Formats root sign-in alerts for Slack
      Runtime: python3.12
      Handler: index.lambda_handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SlackWebhookURL: !Ref SlackWebhookURL
      Code:
        ZipFile: |
          import json
          import urllib3
          import os
          from datetime import datetime

          def lambda_handler(event, context):
              try:
                  http = urllib3.PoolManager()
                  slack_webhook_url = os.environ['SlackWebhookURL']
                  
                  # Parse SNS message - this will be from CloudWatch Alarm
                  sns_message = json.loads(event['Records'][0]['Sns']['Message'])
                  
                  # Extract alarm details
                  alarm_name = sns_message.get('AlarmName', 'Unknown Alarm')
                  reason = sns_message.get('NewStateReason', 'Root user sign-in detected')
                  timestamp = sns_message.get('StateChangeTime', 'Unknown')
                  
                  slack_message = {
                      "text": ":warning: *AWS ROOT USER SIGN-IN DETECTED* :warning:",
                      "attachments": [{
                          "color": "#ff0000",
                          "fields": [
                              {"title": "Alarm", "value": alarm_name, "short": True},
                              {"title": "Time", "value": timestamp, "short": True},
                              {"title": "Reason", "value": reason, "short": False}
                          ],
                          "footer": "AWS Security Alert",
                          "ts": int(datetime.now().timestamp())
                      }]
                  }
                  
                  response = http.request(
                      'POST',
                      slack_webhook_url,
                      body=json.dumps(slack_message),
                      headers={'Content-Type': 'application/json'}
                  )
                  
                  return {"statusCode": response.status}
                  
              except Exception as e:
                  print(f"Error processing alert: {str(e)}")
                  return {
                      "statusCode": 500,
                      "body": f"Error processing alert: {str(e)}"
                  }

  # Lambda IAM Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasSlackWebhook
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda Subscription Permission
  LambdaSubscriptionPermission:
    Type: AWS::Lambda::Permission
    Condition: HasSlackWebhook
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt SlackNotificationLambda.Arn
      Principal: sns.amazonaws.com
      SourceArn: !Ref RootSignInSNSTopic

  RootSignInSNSSubscriptionLambda:
    Type: AWS::SNS::Subscription
    Condition: HasSlackWebhook
    Properties:
      Protocol: lambda
      Endpoint: !GetAtt SlackNotificationLambda.Arn
      TopicArn: !Ref RootSignInSNSTopic

  # ==============================
  # CloudWatch Log Metric Filter
  # ==============================
  RootUserSignInMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudWatchLogGroupName
      FilterName: !Sub iv-edd-${AWS::AccountId}-RootUserSignInFilter-${AWS::Region}
      FilterPattern: '{ $.eventName = "ConsoleLogin" && $.userIdentity.type = "Root" }'
      MetricTransformations:
        - MetricNamespace: "Security/RootAccess"
          MetricName: "RootUserSignInEvents"
          MetricValue: "1"
          DefaultValue: 0

  # ==============================
  # CloudWatch Alarm
  # ==============================
  RootUserSignInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub iv-edd-${AWS::AccountId}-RootUserSignIn-${AWS::Region}
      AlarmDescription: "Alarm when root user signs into AWS Console"
      MetricName: "RootUserSignInEvents"
      Namespace: "Security/RootAccess"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref RootSignInSNSTopic
      TreatMissingData: notBreaching

  # SNS Topic Policy
  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref RootSignInSNSTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: "sns:Publish"
            Resource: !Ref RootSignInSNSTopic

Conditions:
  HasSlackWebhook: !Not [!Equals [!Ref SlackWebhookURL, ""]]
  HasPhoneNumber: !Not [!Equals [!Ref NotificationPhone, ""]]

Outputs:
  SNSTopicArn:
    Description: SNS topic ARN for root sign-in notifications
    Value: !Ref RootSignInSNSTopic
    
  CloudWatchLogGroup:
    Description: CloudWatch Log Group being monitored
    Value: !Ref CloudWatchLogGroupName
    
  SlackNotificationLambdaArn:
    Description: ARN of the Slack notification Lambda function (if deployed)
    Value: !If [HasSlackWebhook, !GetAtt SlackNotificationLambda.Arn, "No Slack webhook provided"]
    
  RootSignInAlarmArn:
    Description: ARN of the CloudWatch alarm for root sign-ins
    Value: !GetAtt RootUserSignInAlarm.Arn
    
  MetricFilterName:
    Description: Name of the metric filter monitoring root sign-ins
    Value: !Ref RootUserSignInMetricFilter