AWSTemplateFormatVersion: '2010-09-09'
Description: 'Creates an AWS Organizational Unit (OU)'

Parameters:
  ParentId:
    Description: 'The ID of the parent (root or another OU)'
    Type: String
    Default: r-xxxx  # Replace with your root ID
  OUName:
    Description: 'Name for the new Organizational Unit'
    Type: String
    Default: 'Production'

Resources:
  NewOrganizationalUnit:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: !Ref OUName
      ParentId: !Ref ParentId

Outputs:
  OUId:
    Description: 'The ID of the newly created OU'
    Value: !Ref NewOrganizationalUnit
  OUArn:
    Description: 'The ARN of the newly created OU'
    Value: !GetAtt NewOrganizationalUnit.Arn